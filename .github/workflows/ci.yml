name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # The Unix gradlew shell wrapper was never committed to this repo
      # (only gradlew.bat is tracked). gradle/actions/setup-gradle@v4
      # installs gradle directly on the Linux runner using the version
      # we declare here, so we can call gradle without ./gradlew. The
      # version matches gradle/wrapper/gradle-wrapper.properties.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Lint release build
        run: gradle lintRelease

      # Signing secrets are intentionally absent in CI. build.gradle emits an
      # unsigned bundle, which still catches R8/resource-shrinking and other
      # release-only failures before a Play upload.
      - name: Build release bundle
        run: gradle bundleRelease -x uploadCrashlyticsSymbolFileRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: wim-debug
          path: app/build/outputs/apk/debug/app-debug.apk
