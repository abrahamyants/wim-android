name: Build & Test

# A plain push to main builds ONLY the giveaway APK — the file that goes on
# the operator's phone, and the only artifact a normal push exists to produce.
# Everything else (debug APK, unit tests, lint, the signed release APK+bundle
# and every check that reads them) is the pre-submission suite and now runs on
# a pull request or on a manual "Run workflow" click instead.
#
# Why: the job compiled the app three times on every one-line change and the
# operator waited ~8 minutes to install it. The unit tests cover pure logic
# only — route tables, the disfluency filter, the meaning guard — while every
# defect found in practice lives in the overlay, the window timing and the
# accessibility injection, which no unit test here can see. So the suite was
# charging eight minutes to guard against a class of bug it does not catch.
#
# Run the full suite before any Play submission — that is what it is for.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Org-hosted 16-core Ubuntu runner (abrahamyants/linux-16core, created
    # 2026-08-22). The free shared runner took ~12 min per push because this
    # job compiles the app three times — debug for the unit tests, signed
    # release for Play, and the keyed giveaway APK — and two of those pass
    # --no-build-cache. Gradle parallelises across cores, so the cores are the
    # lever. Larger sizes exist up to 96-core; an Android build runs out of
    # parallel work well before that, so they would bill more for very little.
    #
    # Billed per minute, unlike the free shared runner. If this ever needs to
    # go back, `ubuntu-latest` is a drop-in replacement — nothing else in the
    # job depends on the runner being org-hosted.
    runs-on: linux-16core
    env:
      ORG_GRADLE_PROJECT_WIM_STORE_PASSWORD: ${{ secrets.WIM_STORE_PASSWORD }}
      ORG_GRADLE_PROJECT_WIM_KEY_PASSWORD: ${{ secrets.WIM_KEY_PASSWORD }}
      ORG_GRADLE_PROJECT_WIM_OPENAI_KEY: ${{ secrets.WIM_OPENAI_KEY }}
      ORG_GRADLE_PROJECT_WIM_ANTHROPIC_KEY: ${{ secrets.WIM_ANTHROPIC_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Restore release signing key
        env:
          WIM_KEYSTORE_BASE64: ${{ secrets.WIM_KEYSTORE_BASE64 }}
        run: |
          test -n "$WIM_KEYSTORE_BASE64"
          printf '%s' "$WIM_KEYSTORE_BASE64" | base64 --decode > wim-release.jks

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # The Unix gradlew shell wrapper was never committed to this repo
      # (only gradlew.bat is tracked). gradle/actions/setup-gradle@v4
      # installs gradle directly on the Linux runner using the version
      # we declare here, so we can call gradle without ./gradlew. The
      # version matches gradle/wrapper/gradle-wrapper.properties.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false

      - name: Build debug APK
        if: github.event_name != 'push'
        run: gradle assembleDebug

      - name: Run unit tests
        if: github.event_name != 'push'
        run: gradle testDebugUnitTest

      - name: Lint release build
        if: github.event_name != 'push'
        run: |
          gradle lintRelease || {
            cat app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt
            exit 1
          }

      # uploadCrashlyticsSymbolFileRelease is NOT excluded. build.gradle.kts wires
      # it into bundleRelease on purpose: without it, sherpa-onnx native crashes
      # arrive in Crashlytics as bare memory addresses. Skipping it here silently
      # defeated that — the symbols were never uploaded for any shipped build.
      - name: Build signed release APK and bundle
        if: github.event_name != 'push'
        run: gradle assembleRelease bundleRelease --no-build-cache

      - name: Verify installable APK signature
        if: github.event_name != 'push'
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      # The one artifact a plain push exists to produce. On a push this now
      # compiles from cold rather than inheriting the release build's work,
      # so it costs more on its own than the 62s it took as the third build —
      # and the run as a whole still lands at roughly half the old time.
      - name: Build full giveaway APK with the stable signer
        run: gradle assembleGiveaway --no-build-cache

      - name: Preserve both APKs for signer diagnosis
        uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'push' && always() }}
        with:
          name: wim-signer-diagnostic-apks
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/giveaway/app-giveaway.apk
          retention-days: 3

      - name: Verify standard and full APKs use the same certificate
        if: github.event_name != 'push'
        run: |
          set -o pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          standard_report="$("$apksigner" verify --verbose --print-certs \
            app/build/outputs/apk/release/app-release.apk 2>&1)"
          full_report="$("$apksigner" verify --verbose --print-certs \
            app/build/outputs/apk/giveaway/app-giveaway.apk 2>&1)"
          printf '%s\n' 'STANDARD APK SIGNATURE' "$standard_report"
          printf '%s\n' 'FULL APK SIGNATURE' "$full_report"
          standard="$(printf '%s\n' "$standard_report" \
            | sed -n 's/^.*certificate SHA-256 digest: //p' | head -1)"
          full="$(printf '%s\n' "$full_report" \
            | sed -n 's/^.*certificate SHA-256 digest: //p' | head -1)"
          test -n "$standard"
          test -n "$full"
          test "$standard" = "$full"

      - name: Reject bundled provider keys
        if: github.event_name != 'push'
        run: |
          forbidden="$(unzip -Z1 app/build/outputs/bundle/release/app-release.aab | rg '(^|/)(api_key|anthropic_key)\.txt$' || true)"
          if test -n "$forbidden"; then
            echo 'Release bundle contains a forbidden provider-key asset.'
            printf '%s\n' "$forbidden"
            exit 1
          fi

      - name: Reject advertising identifier permissions
        if: github.event_name != 'push'
        run: |
          forbidden="$(unzip -p app/build/outputs/bundle/release/app-release.aab base/manifest/AndroidManifest.xml \
            | strings \
            | rg 'com\.google\.android\.gms\.permission\.AD_ID|android\.permission\.ACCESS_ADSERVICES_(AD_ID|ATTRIBUTION)' \
            || true)"
          if test -n "$forbidden"; then
            echo 'Release bundle requests advertising identifiers even though WiM has no ads.'
            printf '%s\n' "$forbidden"
            exit 1
          fi

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        if: github.event_name != 'push'
        with:
          name: wim-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      # Publish the stable release-signed APK for real-phone testing. Never
      # distribute app-debug.apk: GitHub's ephemeral debug keystore changes
      # its signer every run, which forces an uninstall and resets Android's
      # AccessibilityService approval.
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        if: github.event_name != 'push'
        with:
          name: wim-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Upload stable-signed full APK
        uses: actions/upload-artifact@v4
        with:
          name: wim-giveaway-apk
          path: app/build/outputs/apk/giveaway/app-giveaway.apk
          retention-days: 14
