name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_WIM_STORE_PASSWORD: ${{ secrets.WIM_STORE_PASSWORD }}
      ORG_GRADLE_PROJECT_WIM_KEY_PASSWORD: ${{ secrets.WIM_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Restore release signing key
        env:
          WIM_KEYSTORE_BASE64: ${{ secrets.WIM_KEYSTORE_BASE64 }}
        run: |
          test -n "$WIM_KEYSTORE_BASE64"
          printf '%s' "$WIM_KEYSTORE_BASE64" | base64 --decode > wim-release.jks

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # The Unix gradlew shell wrapper was never committed to this repo
      # (only gradlew.bat is tracked). gradle/actions/setup-gradle@v4
      # installs gradle directly on the Linux runner using the version
      # we declare here, so we can call gradle without ./gradlew. The
      # version matches gradle/wrapper/gradle-wrapper.properties.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Lint release build
        run: |
          gradle lintRelease || {
            cat app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt
            exit 1
          }

      - name: Build signed release bundle
        run: gradle bundleRelease -x uploadCrashlyticsSymbolFileRelease

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: wim-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: wim-debug
          path: app/build/outputs/apk/debug/app-debug.apk
