name: Publish dated APK release

# Attaches an already-built giveaway APK to a dated release and rewrites the
# README download link, entirely on GitHub's network.
#
# 2026-09-11: added after an upload of the 65 MB APK from George's phone timed
# out twice, and `gh release create` rolled its own release back on failure.
# The APK is built by ci.yml on a runner, so pulling it down to a phone and
# pushing it back up was a pointless round trip. This never rebuilds — it takes
# the artifact ci.yml already produced, which is also the binary that was
# tested, so the release cannot drift from the build that passed.

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Release date, YYYY-MM-DD in San Francisco time"
        required: true
      run_id:
        description: "ci.yml run whose wim-giveaway-apk artifact to publish. Blank = latest successful run on main."
        required: false
        default: ""
      notes:
        description: "One-line summary for the release page"
        required: false
        default: "Routine build."

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Pick the build to publish
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN="${{ inputs.run_id }}"
          if [ -z "$RUN" ]; then
            RUN=$(gh run list --workflow ci.yml --branch main --status success \
                    --limit 1 --json databaseId -q '.[0].databaseId')
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "publishing artifact from ci.yml run $RUN"

      - name: Download the APK that ci.yml already built
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ steps.pick.outputs.run }}" -n wim-giveaway-apk -D apk

      - name: Name the file after the versionCode the phone reports
        id: name
        run: |
          SRC=$(find apk -name '*.apk' | head -1)
          # versionCode is gitCommitCount(), not a literal in build.gradle.kts,
          # so read it out of the built APK's manifest instead of the source.
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          VC=$("$AAPT" dump badging "$SRC" 2>/dev/null \
                | grep -oP "versionCode='\K[0-9]+" | head -1)
          if [ -z "$VC" ]; then
            echo "could not read versionCode from $SRC" >&2
            exit 1
          fi
          OUT="WiM-vc${VC}-${{ inputs.date }}-full.apk"
          cp "$SRC" "$OUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          echo "vc=$VC"   >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Publish the release with the APK attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.0-${{ inputs.date }}-full"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "${{ steps.name.outputs.apk }}" \
            --title "WiM ${{ inputs.date }} (vc${{ steps.name.outputs.vc }})" \
            --notes "${{ inputs.notes }}"

      - name: Point the README download link at this build
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ inputs.date }}
          VC: ${{ steps.name.outputs.vc }}
          APK: ${{ steps.name.outputs.apk }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, re
          url  = f"https://github.com/{os.environ['REPO']}/releases/download/v1.0.0-{os.environ['DATE']}-full/{os.environ['APK']}"
          line = f"### ▶ [Download WiM — {os.environ['DATE']} (vc{os.environ['VC']})]({url})"
          s = open('README.md').read()
          s = re.sub(r'^### ▶ \[Download WiM.*$', lambda m: line, s, count=1, flags=re.M)
          open('README.md','w').write(s)
          PY
          head -6 README.md
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: README download link -> ${DATE} (vc${VC}) [skip ci]" || exit 0
          git push
