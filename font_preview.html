<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>WiM Font Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Fascinate&family=Limelight&family=Poiret+One&display=swap" rel="stylesheet">
<style>
body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    gap: 40px;
    padding: 40px;
}
.preview {
    text-align: center;
}
.font-name {
    color: #888;
    font-family: monospace;
    font-size: 14px;
    margin-bottom: 8px;
    letter-spacing: 2px;
}
.wim {
    color: #D4AF37;
    font-size: 80px;
    letter-spacing: 4px;
}
.wim-large {
    color: #D4AF37;
    font-size: 120px;
    letter-spacing: 6px;
}
.wm-only {
    color: #EE5A24;
    font-size: 120px;
    letter-spacing: -8px;
}
.subtitle {
    color: #ffffff88;
    font-family: sans-serif;
    font-size: 14px;
    letter-spacing: 3px;
    margin-top: 4px;
}
hr {
    width: 80%;
    border: none;
    border-top: 1px solid #333;
    margin: 20px 0;
}
</style>
</head>
<body>

<div class="preview">
    <div class="font-name">FASCINATE (Broadway-inspired, Art Deco)</div>
    <div class="wim" style="font-family: 'Fascinate', cursive;">WiM</div>
    <div class="subtitle">What I Meant</div>
    <div style="margin-top:20px">
        <div class="font-name">LOGO (WM only, tight kerning)</div>
        <div class="wm-only" style="font-family: 'Fascinate', cursive;">WM</div>
    </div>
</div>

<hr>

<div class="preview">
    <div class="font-name">LIMELIGHT (Classic Art Deco geometric)</div>
    <div class="wim" style="font-family: 'Limelight', cursive;">WiM</div>
    <div class="subtitle">What I Meant</div>
    <div style="margin-top:20px">
        <div class="font-name">LOGO (WM only, tight kerning)</div>
        <div class="wm-only" style="font-family: 'Limelight', cursive;">WM</div>
    </div>
</div>

<hr>

<div class="preview">
    <div class="font-name">POIRET ONE (Art Deco + Constructivism)</div>
    <div class="wim" style="font-family: 'Poiret One', cursive;">WiM</div>
    <div class="subtitle">What I Meant</div>
    <div style="margin-top:20px">
        <div class="font-name">LOGO (WM only, tight kerning)</div>
        <div class="wm-only" style="font-family: 'Poiret One', cursive;">WM</div>
    </div>
</div>

</body>
</html>
